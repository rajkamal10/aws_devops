name: Deploy to AWS
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::844099234941:role/github_action_role
          aws-region: ap-south-1
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file s3-bucket-stack.yml \
            --stack-name my-s3-bucket-stack \
            --parameter-overrides BucketName=rajkamal10-devops-bucket \
            --capabilities CAPABILITY_NAMED_IAM
