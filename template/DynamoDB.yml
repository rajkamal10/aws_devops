AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB table for Terraform state locking

Parameters:
  TableName:
    Type: String
    Description: Name of the DynamoDB table
  PartitionKeyName:
    Type: String
    Default: LockID
    Description: Partition key name
  PartitionKeyType:
    Type: String
    AllowedValues: [S, N, B]
    Default: S
    Description: Partition key type (S=String, N=Number, B=Binary)
  BillingMode:
    Type: String
    AllowedValues: [PROVISIONED, PAY_PER_REQUEST]
    Default: PAY_PER_REQUEST
    Description: Billing mode for DynamoDB

Resources:
  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: !Ref BillingMode
      AttributeDefinitions:
        - AttributeName: !Ref PartitionKeyName
          AttributeType: !Ref PartitionKeyType
      KeySchema:
        - AttributeName: !Ref PartitionKeyName
          KeyType: HASH
